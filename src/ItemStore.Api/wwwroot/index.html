<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>ItemStore</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Каталог товаров</h1>

    <form id="add-form">
        <input id="name" placeholder="Название" required>
        <input id="price" type="number" placeholder="Цена" required>
        <input id="quantity" type="number" placeholder="Кол-во" required>
        <button type="submit">Добавить</button>
    </form>

    <table id="items-table">
        <thead>
            <tr><th>Название</th><th>Цена</th><th>Кол-во</th><th></th></tr>
        </thead>
        <tbody></tbody>
        </table>

    <script src="app.js"></script>
</body>
</html>
